<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>机器学习工作流 · Cortex Studio</title>
  <style>
    :root {
      --brand: #5B4FE9; --brand2: #7A6CF7; --brand-soft: #EEF0FF;
      --ink: #1B2143; --body: #4A516B; --muted: #8B91A8;
      --line: #E7E9F3; --bg: #F7F8FC; --panel: #FFFFFF;
      --ok: #12A670; --warn: #D98A16; --danger: #DC4B5B;
      --shadow: 0 10px 34px rgba(31, 41, 92, .06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--brand); }
    .app { display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: 236px; flex: 0 0 236px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px 14px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; font-weight: 700; font-size: 17px; letter-spacing: .2px; }
    .brand .mark { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #4F8BFF, var(--brand)); color: #fff; display: grid; place-items: center; flex: 0 0 30px; }
    .brand .mark svg { width: 17px; height: 17px; }
    .btn-new { width: 100%; border: 0; border-radius: 11px; background: var(--brand); color: #fff; font-weight: 700; padding: 11px 12px; box-shadow: 0 6px 16px rgba(91, 79, 233, .28); }
    .btn-new:hover { background: var(--brand2); }
    .nav-scroll { flex: 1; overflow-y: auto; margin-top: 16px; scrollbar-width: thin; }
    .nav-group { font-size: 11px; letter-spacing: .6px; color: var(--muted); padding: 14px 10px 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; color: var(--body); font-weight: 500; margin-bottom: 2px; white-space: nowrap; }
    .nav-item:hover { background: #F5F6FD; }
    .nav-item.on { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
    .nav-item .ico { width: 26px; height: 26px; border-radius: 8px; background: #F0F1F8; display: grid; place-items: center; flex: 0 0 26px; color: #7B829E; }
    .nav-item.on .ico { background: #fff; color: var(--brand); }
    .nav-item .ico svg { width: 15px; height: 15px; }
    .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: #EEF0F6; color: #9097AC; font-size: 11px; display: grid; place-items: center; }
    .nav-item.on .badge { background: #fff; color: var(--brand); }
    .nav-sub { margin: 2px 0 8px 46px; border-left: 1px solid var(--line); padding-left: 8px; }
    .nav-sub div { padding: 6px 8px; border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
    .nav-sub div:hover, .nav-sub div.on { color: var(--brand); background: var(--brand-soft); }
    .user-card { display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 14px 6px 0; }
    .avatar { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; background: #F2E9E4; color: #8A5A45; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .user-card b { display: block; font-size: 13px; }
    .user-card small { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; max-width: 160px; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 64px; flex: 0 0 64px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 22px; }
    .icon-btn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--body); display: grid; place-items: center; font-size: 13px; }
    .icon-btn:hover { border-color: var(--brand); color: var(--brand); }
    .icon-btn svg { width: 17px; height: 17px; }
    .crumb { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
    .crumb .ico { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
    .crumb .ico svg { width: 15px; height: 15px; }
    .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .pill-soft { border: 0; border-radius: 10px; background: var(--brand-soft); color: var(--brand); font-weight: 700; padding: 9px 14px; }
    .pill-soft svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }

    .content { flex: 1; overflow-y: auto; padding: 28px 34px 24px; }
    .content-in { max-width: 1080px; margin: 0 auto; }
    .drop { width: min(680px, 100%); margin: 22px auto 0; border: 1.5px dashed #CBD0EA; border-radius: 16px; background: var(--panel); padding: 42px 24px 34px; text-align: center; box-shadow: var(--shadow); }
    .drop.drag { border-color: var(--brand); background: #FAFAFF; }
    .drop .up { width: 58px; height: 58px; margin: 0 auto 12px; color: var(--brand); }
    .drop .up svg { width: 100%; height: 100%; }
    .drop h2 { margin: 0 0 6px; font-size: 21px; }
    .drop p { margin: 0; color: var(--muted); }
    .btn-primary { border: 0; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 700; padding: 11px 20px; box-shadow: 0 6px 16px rgba(91, 79, 233, .24); }
    .btn-primary:hover { background: var(--brand2); }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-ghost { border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--body); padding: 10px 16px; font-weight: 600; }
    .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }
    .drop .choose { margin: 22px 0 20px; }
    .drop .formats { font-size: 12.5px; color: var(--muted); }
    .quick-wrap { width: min(680px, 100%); margin: 22px auto 0; text-align: center; }
    .quick-wrap .btn-primary { padding: 13px 26px; }
    .privacy { width: min(680px, 100%); margin: 26px auto 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--muted); font-size: 12.5px; }
    .privacy b { color: var(--body); display: block; margin-bottom: 3px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card h3 { margin: 0 0 10px; font-size: 14px; }
    .card .desc { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row.end { justify-content: flex-end; }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 18px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { font-size: 22px; line-height: 1.4; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    label.field { display: grid; gap: 6px; font-size: 13px; color: var(--body); }
    select, input[type=number], input[type=text] { background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
    input[type=range] { accent-color: var(--brand); }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--body); cursor: pointer; }
    .check input { accent-color: var(--brand); width: 16px; height: 16px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 9px 15px; color: var(--body); font-weight: 600; }
    .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { background: #F8F9FD; color: var(--muted); font-weight: 600; font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; background: var(--brand-soft); color: var(--brand); }
    .tag.gray { background: #F0F1F6; color: var(--muted); }
    .tag.warn { background: #FFF4E3; color: var(--warn); }
    .note { background: #F8F9FD; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); font-size: 12.5px; margin-top: 14px; }
    .note.warn { background: #FFF9EE; border-color: #F5E2BE; color: #8A6425; }
    canvas { width: 100%; height: 240px; display: block; }
    .chart-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .empty { text-align: center; padding: 54px 20px; color: var(--muted); }
    .empty .big { font-size: 34px; margin-bottom: 8px; }
    .empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; }
    .msg { min-height: 20px; color: var(--brand); font-size: 13px; margin: 10px 0 0; }
    .msg.err { color: var(--danger); }
    .rules { font-size: 12.5px; line-height: 2; color: var(--body); }
    .rules code { background: #F3F4FB; padding: 2px 6px; border-radius: 5px; }
    .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }

    .steps { height: 76px; flex: 0 0 76px; background: var(--panel); border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 20px; }
    .step { display: flex; align-items: center; gap: 9px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; }
    .step .num { width: 30px; height: 30px; border-radius: 50%; background: #ECEEF5; color: #9AA0B4; display: grid; place-items: center; font-size: 13px; }
    .step.on { color: var(--brand); }
    .step.on .num { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(91, 79, 233, .3); }
    .step.done .num { background: var(--brand-soft); color: var(--brand); }
    .step-sep { color: #C9CEE0; }

    .overlay { position: fixed; inset: 0; background: rgba(20, 26, 56, .55); display: none; place-items: center; padding: 18px; z-index: 30; }
    .overlay.open { display: grid; }
    .modal { width: min(660px, 100%); max-height: 88vh; overflow-y: auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(20, 26, 56, .2); }
    .modal h2 { margin: 0 0 6px; font-size: 19px; }
    .modal .sub { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
    .pick { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-bottom: 8px; }
    .pick-card { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff; padding: 16px; }
    .pick-card:hover { border-color: var(--brand); background: #FAFAFF; }
    .pick-card b { display: block; font-size: 14px; margin-bottom: 4px; }
    .pick-card span { color: var(--muted); font-size: 12.5px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .tour-step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .tour-step:last-child { border-bottom: 0; }
    .tour-step .n { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-weight: 700; }
    .tour-step b { display: block; }
    .tour-step span { color: var(--muted); font-size: 12.5px; }

    @media (max-width: 980px) { .grid2, .grid3, .pick { grid-template-columns: 1fr; } }
    @media (max-width: 820px) {
      .sidebar { width: 62px; flex-basis: 62px; padding: 14px 8px; }
      .brand span, .btn-new span, .nav-group, .nav-item .label, .badge, .nav-sub, .user-card div { display: none; }
      .brand { justify-content: center; padding: 0 0 14px; }
      .btn-new { font-size: 18px; padding: 8px; }
      .nav-item { justify-content: center; }
      .user-card { justify-content: center; }
      .content { padding: 18px 16px; }
      .topbar { padding: 0 12px; }
      .pill-soft { padding: 8px 10px; font-size: 12px; }
      .steps { gap: 8px; }
      .step span:last-child { display: none; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></div><span>Cortex Studio</span></div>
    <button type="button" class="btn-new" data-act="session">+ <span data-i18n="nav.newSession">新建会话</span></button>
    <div class="nav-scroll">
      <div class="nav-group" data-i18n="nav.groupWorkflow">机器学习工作流</div>
      <div class="nav-item" data-act="goto" data-v="loader"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 17v3h16v-3"/></svg></span><span class="label" data-i18n="nav.loader">数据加载器</span><span class="badge" id="badge-loader">0</span></div>
      <div class="nav-item" data-act="goto" data-v="preprocess"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></span><span class="label" data-i18n="nav.preprocess">预处理器</span><span class="badge" id="badge-pre">2</span></div>
      <div class="nav-item" data-act="goto" data-v="task"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 7.5 11 16M16.5 7.5 13 16M8.5 6h7"/></svg></span><span class="label" data-i18n="nav.task">机器学习任务</span><span class="badge">3</span></div>
      <div class="nav-sub" id="task-sub">
        <div data-act="task" data-v="cluster" id="sub-cluster">K-Means 聚类</div>
        <div data-act="task" data-v="regression" id="sub-regression">线性回归</div>
        <div data-act="task" data-v="tree" id="sub-tree">决策树分类</div>
      </div>
      <div class="nav-group" data-i18n="nav.groupInsight">快讯</div>
      <div class="nav-item" data-act="goto" data-v="attributes"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18" cy="18" r="2"/></svg></span><span class="label" data-i18n="nav.attributes">属性选择器</span></div>
      <div class="nav-item" data-act="goto" data-v="visual"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V4M4 20h16M8 16l4-5 3 2 5-7"/></svg></span><span class="label" data-i18n="nav.visual">数据可视化</span></div>
      <div class="nav-item" data-act="goto" data-v="insights"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span class="label" data-i18n="nav.insights">数据质量快报</span></div>
    </div>
    <div class="user-card"><div class="avatar">Xi</div><div><b data-i18n="nav.user">本地会话</b><small data-i18n="nav.userSub">数据仅存本机</small></div></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button type="button" class="icon-btn" data-act="back" title="Back">‹</button>
      <div class="crumb"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 17v3h16v-3"/></svg></span><span id="view-title">数据加载器</span></div>
      <div class="top-actions">
        <button type="button" class="pill-soft" data-act="tour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span data-i18n="top.tour">使用引导</span></button>
        <button type="button" class="icon-btn" data-act="home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
        <button type="button" class="icon-btn" data-act="tour" title="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4zM20 5h-3a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h3z"/></svg></button>
        <button type="button" class="icon-btn" data-act="lang" id="lang-btn" style="width:auto;padding:0 10px;font-weight:700">EN</button>
      </div>
    </header>

    <div class="content"><div class="content-in" id="content"></div></div>

    <footer class="steps">
      <div class="step" data-act="goto" data-v="loader" id="step-1"><span class="num">1</span><span data-i18n="step.loader">数据加载器</span></div>
      <span class="step-sep">›</span>
      <div class="step" data-act="goto" data-v="preprocess" id="step-2"><span class="num">2</span><span data-i18n="step.preprocess">预处理器</span></div>
      <span class="step-sep">›</span>
      <div class="step" data-act="goto" data-v="task" id="step-3"><span class="num">3</span><span data-i18n="step.task">机器学习任务</span></div>
    </footer>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<input type="file" id="file" accept=".csv,.arff,.txt,text/csv" hidden>

function readFile(file) {
  if (!file) return;
  if (file.size > MAX_FILE) { notify(t('load.tooBig'), true); return; }
  if (!/\.(csv|arff|txt)$/i.test(file.name)) { notify(t('load.badType'), true); return; }
  var reader = new FileReader();
  reader.onload = function () {
    var ds = parseFileText(file.name, String(reader.result || ''));
    if (!ds) { notify(t('load.parseFail'), true); return; }
    loadDataset(ds);
  };
  reader.onerror = function () { notify(t('load.parseFail'), true); };
  reader.readAsText(file);
}
function loadDataset(ds) {
  S.dataset = ds; S.result = null;
  initSelection(ds);
  S.view = 'loader'; S.history = [];
  notify(t('load.uploaded'));
}
function runTask() {
  if (!S.features.length) { notify(t('task.needFeatures'), true); return; }
  var M = buildMatrix();
  if (!M || !M.X.length || !M.X[0].length) { notify(t('task.needFeatures'), true); return; }
  var tv = targetVector(M);
  if (S.task === 'regression') {
    if (!tv || !tv.numeric) { notify(t('task.needNumericTarget'), true); return; }
    var y = tv.values.map(function (v) { var n = Number(v); return isFinite(n) ? n : 0; });
    var lr = linreg(M.X, y);
    lr.coefLabels = M.enc.map(function (e) { return e.label; });
    lr.coefAbs = lr.beta.slice(1).map(function (v) { return Math.abs(v); });
    S.result = { kind: 'regression', model: lr, M: M };
  } else if (S.task === 'tree') {
    if (!tv || tv.numeric) { notify(t('task.needCategoryTarget'), true); return; }
    var tr = decisionTree(M.X, tv.values, M.enc);
    var counts = {};
    tv.values.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
    tr.classCounts = Object.keys(counts).map(function (k) { return { label: k, value: counts[k] }; });
    S.result = { kind: 'tree', model: tr, M: M };
  } else {
    var km = kmeans(M.X, S.k);
    if (M.X.length > 2) km.elbow = elbow(M.X);
    else km.elbow = [{ k: S.k, wcss: km.wcss }];
    S.result = { kind: 'cluster', model: km, M: M };
  }
  S.preApplied = true;
  notify(t('task.result'));
}
function csvCell(v) {

}
function exportResult() {
  if (!S.result) return;
  var R = S.result, M = R.M, header = M.enc.map(function (e) { return e.label; }), lines = [];
  if (R.kind === 'cluster') { header.push('cluster'); M.X.forEach(function (row, i) { lines.push(row.concat([R.model.assign[i] + 1]).map(csvCell).join(',')); }); }
  else if (R.kind === 'regression') { header.push('actual', 'predicted'); M.X.forEach(function (row, i) { lines.push(row.concat([R.model.y[i], R.model.pred[i]]).map(csvCell).join(',')); }); }
  else { header.push('predicted_class'); M.X.forEach(function (row, i) { lines.push(row.concat([R.model.predicted[i]]).map(csvCell).join(',')); }); }
  var blob = new Blob(['\uFEFF' + header.map(csvCell).join(',') + '\n' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'ml-studio-' + R.kind + '-result.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  notify(t('task.exported'));
}

function tourModal() {
  var steps = [['tour.1', 'tour.1d'], ['tour.2', 'tour.2d'], ['tour.3', 'tour.3d']];
  openModal('<h2>' + esc(t('tour.title')) + '</h2><p class="sub">' + esc(t('tour.sub')) + '</p>' +
    steps.map(function (s, i) { return '<div class="tour-step"><div class="n">' + (i + 1) + '</div><div><b>' + esc(t(s[0])) + '</b><span>' + esc(t(s[1])) + '</span></div></div>'; }).join('') +
    '<div class="note warn" style="margin-top:16px">' + esc(t('tour.note')) + '</div>' +
    '<div class="modal-actions"><button type="button" class="btn-ghost" data-act="close">' + esc(t('load.close')) + '</button></div>');
}
function resetModal() {
  openModal('<h2>' + esc(t('ses.title')) + '</h2><p class="sub">' + esc(t('ses.desc')) + '</p>' +
    '<div class="modal-actions"><button type="button" class="btn-ghost" data-act="close">' + esc(t('c.cancel')) + '</button>' +
    '<button type="button" class="btn-primary" data-act="do-reset">' + esc(t('c.yes')) + '</button></div>');
}

function onClick(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
  if (act === 'upload') document.getElementById('file').click();
  else if (act === 'sample') sampleModal();
  else if (act === 'sample-retail') { closeModal(); loadDataset(sampleRetail()); }
  else if (act === 'sample-iris') { closeModal(); loadDataset(sampleIris()); }
  else if (act === 'close') closeModal();
  else if (act === 'tour') tourModal();
  else if (act === 'goto') go(v);
  else if (act === 'back') { var prev = S.history.pop(); if (prev) { S.view = prev; S.msg = ''; render(); } }
  else if (act === 'home') go('loader');
  else if (act === 'lang') { S.lang = S.lang === 'zh' ? 'en' : 'zh'; savePrefs(); render(); }
  else if (act === 'session') go('session');
  else if (act === 'confirm-reset') resetModal();
  else if (act === 'do-reset') { closeModal(); S.dataset = null; S.result = null; S.view = 'loader'; S.history = []; S.msg = ''; render(); }
  else if (act === 'task') { S.task = v; S.result = null; S.msg = ''; if (v === 'tree' && S.dataset) { var cat = S.dataset.cols.findIndex(function (c) { return !c.numeric && c.unique > 1 && c.unique <= 12; }); if (cat >= 0) S.target = cat; } else if (v === 'regression' && S.dataset) { var num = S.dataset.cols.findIndex(function (c) { return c.numeric && c.unique > 2; }); if (num >= 0) S.target = num; } savePrefs(); S.view = 'task'; render(); }
  else if (act === 'run') runTask();
  else if (act === 'export') exportResult();
}
function onChange(e) {
  var el = e.target, cfg = el.getAttribute('data-cfg');
  if (!cfg) return;
  if (cfg === 'missing') S.pre.missing = el.value;
  else if (cfg === 'dedupe') S.pre.dedupe = el.checked;
  else if (cfg === 'normalize') S.pre.normalize = el.checked;
  else if (cfg === 'k') S.k = Number(el.value);
  else if (cfg === 'target') S.target = Number(el.getAttribute('data-v') !== null ? el.getAttribute('data-v') : el.value);
  else if (cfg === 'feature') {
    var i = Number(el.getAttribute('data-v'));
    if (el.checked) { if (S.features.indexOf(i) < 0) S.features.push(i); }
    else S.features = S.features.filter(function (x) { return x !== i; });
  }
  else if (cfg === 'hist') S.vis.hist = Number(el.value);
  else if (cfg === 'sx') S.vis.sx = Number(el.value);
  else if (cfg === 'sy') S.vis.sy = Number(el.value);
  S.result = null;
  savePrefs();
  render();
}

loadPrefs();
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.getElementById('overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeModal(); });
document.getElementById('file').addEventListener('change', function (e) { if (e.target.files[0]) readFile(e.target.files[0]); e.target.value = ''; });
render();
</script>
</body>
</html>
